<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1380" viewBox="0 0 1000 1380" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .b{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}
      .d{fill:#fef3c7;stroke:#d97706;stroke-width:2}
      .o{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}
      .r{fill:#fee2e2;stroke:#dc2626;stroke-width:2}
      .t{font-size:18px;fill:#0f172a;text-anchor:middle}
      .tb{font-size:18px;font-weight:700;fill:#0f172a;text-anchor:middle}
      .l{font-size:16px;font-weight:700;fill:#475569}
      .ln{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1000" height="1380" fill="#ffffff"/>

  <rect x="400" y="20" width="200" height="54" rx="27" class="o"/>
  <text x="500" y="54" class="tb">START</text>
  <path class="ln" d="M500 74 V100"/>

  <rect x="290" y="102" width="420" height="78" rx="10" class="b"/>
  <text x="500" y="134" class="t">Setup: pins, SPI, LCD, lamp test,</text>
  <text x="500" y="160" class="t">load laser calibration from EEPROM</text>
  <path class="ln" d="M500 180 V210"/>

  <rect x="290" y="212" width="420" height="60" rx="10" class="b"/>
  <text x="500" y="249" class="t">Read buttons and serial commands</text>
  <path class="ln" d="M500 272 V300"/>

  <polygon points="500,302 660,357 500,412 340,357" class="d"/>
  <text x="500" y="352" class="t">Calibrate</text>
  <text x="500" y="374" class="t">requested?</text>
  <path class="ln" d="M660 357 H728"/>
  <text x="672" y="345" class="l">Yes</text>
  <rect x="730" y="317" width="250" height="80" rx="10" class="b"/>
  <text x="855" y="349" class="t">Measure clear-air laser</text>
  <text x="855" y="373" class="t">baseline → EEPROM</text>
  <path class="ln" d="M855 397 V450 H502"/>
  <path class="ln" d="M500 412 V470"/>
  <text x="510" y="440" class="l">No</text>

  <polygon points="500,472 650,522 500,572 350,522" class="d"/>
  <text x="500" y="518" class="t">1 second</text>
  <text x="500" y="540" class="t">elapsed?</text>
  <text x="300" y="512" class="l">No</text>
  <path class="ln" d="M350 522 H90 V948 H368"/>
  <path class="ln" d="M500 572 V600"/>
  <text x="510" y="592" class="l">Yes</text>

  <rect x="260" y="602" width="480" height="78" rx="10" class="o"/>
  <text x="500" y="634" class="t">Read sensors: DHT11 (every 2 s), LDR,</text>
  <text x="500" y="660" class="t">laser OFF/ON × 4 → signal</text>
  <path class="ln" d="M500 680 V705"/>

  <rect x="260" y="707" width="480" height="56" rx="10" class="b"/>
  <text x="500" y="742" class="t">Compute 5 scaled features</text>
  <path class="ln" d="M500 763 V788"/>

  <rect x="260" y="790" width="480" height="56" rx="10" class="b"/>
  <text x="500" y="825" class="t">Edge AI (softmax) → P(clear / light / dense)</text>
  <path class="ln" d="M500 846 V871"/>

  <rect x="260" y="873" width="480" height="56" rx="10" class="b"/>
  <text x="500" y="908" class="t">Fault check + hysteresis → state, CSV line</text>
  <path class="ln" d="M500 929 V946"/>

  <polygon points="500,948 632,998 500,1048 368,998" class="d"/>
  <text x="500" y="994" class="t">Sensor</text>
  <text x="500" y="1016" class="t">fault?</text>
  <path class="ln" d="M632 998 H698"/>
  <text x="642" y="986" class="l">Yes</text>
  <rect x="700" y="958" width="280" height="80" rx="10" class="r"/>
  <text x="840" y="990" class="t">Fail-safe: all LEDs blink,</text>
  <text x="840" y="1014" class="t">full brightness, LCD alert</text>
  <path class="ln" d="M840 1038 V1210 H742"/>
  <path class="ln" d="M500 1048 V1075"/>
  <text x="510" y="1066" class="l">No</text>

  <rect x="230" y="1077" width="540" height="104" rx="10" class="o"/>
  <text x="500" y="1107" class="tb">Guiding lights by state</text>
  <text x="500" y="1133" class="t">CLEAR: off · LIGHT FOG: chase 150 ms, medium</text>
  <text x="500" y="1158" class="t">DENSE FOG: chase 300 ms, full · dimmer at night</text>
  <path class="ln" d="M500 1181 V1208"/>

  <rect x="260" y="1210" width="480" height="56" rx="10" class="b"/>
  <text x="500" y="1245" class="t">Update LCD every 0.5 s (rotating pages)</text>
  <path class="ln" d="M500 1266 V1320 H40 V242 H288"/>
  <text x="60" y="1310" class="l">loop()</text>
</svg>
